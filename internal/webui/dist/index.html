<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>BastionDeck · 前端资源未构建</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0f1419; color: #d7dde3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.7;
      }
      .card {
        width: 640px; max-width: 92vw; background: #1a2027;
        border: 1px solid #2c353f; border-radius: 12px; padding: 28px 30px;
      }
      h1 { color: #2dd4bf; font-size: 20px; margin: 0 0 12px; }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #0a0e12; border: 1px solid #232b34; border-radius: 8px;
      }
      code { padding: 2px 6px; }
      pre { padding: 14px 16px; overflow: auto; color: #9fe7dc; }
      .muted { color: #8a96a3; font-size: 13px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>◆ BastionDeck 前端资源尚未构建</h1>
      <p>
        当前二进制内嵌的是占位页面。仓库默认不提交压缩后的前端产物，
        请先构建 React 界面，再重新编译后端：
      </p>
      <pre>make web          # = cd web &amp;&amp; npm install &amp;&amp; npm run build
make build        # 重新 go build，新二进制即内嵌完整界面</pre>
      <p>
        仅构建后端无需 Node：<code>make build</code> 始终可用，
        只是在执行 <code>make web</code> 之前会显示本占位页。
      </p>
      <p class="muted">
        后端 REST/SSE/WS API、TUI 与 bdk CLI 不依赖前端构建，可直接使用。
      </p>
    </div>
  </body>
</html>
